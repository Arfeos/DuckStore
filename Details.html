<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles del Producto</title>
  <!-- css injection -->
  <link rel="stylesheet" href="src/css/styles.css" />
  <!-- font importation -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&" />
</head>

<body>
  <header-component></header-component>
  <footer-component></footer-component>
  <script src="src/js/components.js"></script>
  <!-- Inicio sección de detalles del producto -->
  <main class="product-container">
    <!--carrusel principal-->
    <section class="gallery-container">
      <div class="columna-imagen-carrusel">
        <button class="prev-button" aria-label="Previous Image"><span class="material-symbols-outlined">flecha hacia
            atrás</span></button>
        <img src="src/img/venta-exclusiva.png" alt="Galaxy Duck" /></img>
        <button class="next-button" aria-label="Next Image"><span class="material-symbols-outlined">flecha hacia
            adelante</span></button>
      </div>
      <!--imagenes pequeñas-->
      <div class="imagenes-pequenas">
        <div class="hojear" onclick="changeImage(0)">
          <img src="src/img/venta-exclusiva.png" alt="visual 1: Galaxy Duck" class="small-image"></img>
        </div>
        <div class="hojear" onclick="changeImage(1)">
          <img src="src/img/venta-exclusiva.png" alt="visual 2: Galaxy Duck" class="small-image"></img>
        </div>
        <div class="hojear" onclick="changeImage(2)">
          <img src="src/img/venta-exclusiva.png" alt="visual 3: Galaxy Duck" class="small-image"></img>
        </div>
      </div>
    </section>
    <script src="src/js/carrusel.js"></script>
    <!-- Descripción del producto -->
    <section class="description-container">
      <h1 class="titulo-producto">Pato Galáctico</h1>
      <div class="precio-producto">24,99 €</div>
      <p class="descripcion-producto">Ilumina tu bañera con nuestra edición limitada intergaláctica. Este patito no solo flota con gracia celestial, sino que absorbe la luz para revelar constelaciones brillantes en la oscuridad. Perfecto para navegantes nocturnos y soñadores estelares.</p>
      <!-- Información de stock -->
      <div class="stock-info">
        <span class="stock-icon">Stock disponible</span>
      </div>
      <!-- Cantidad-->
      <div class="cantidad">
        <label for="cantidad">Cantidad:</label>
        <button class="cantidad-btn" type="button" onclick="decreaseQuantity()">-</button>
        <input type="number" id="cantidad" name="cantidad" min="1" value="1"></input>
        <button class="cantidad-btn" type="button" onclick="increaseQuantity()">+</button>
      </div>
      <!-- Botón de compra -->
      <div class="boton-comprar">
        <button class="comprar-btn" type="button">Añadir al carrito<span class="material-symbols-outlined icon-sm"
            aria-hidden="true">continuar</span></button>
      </div>
    </section>
  </main>
  <!-- Final sección de detalles del producto -->
</body>

</html>
